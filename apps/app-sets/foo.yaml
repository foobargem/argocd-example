apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: foo-application-set
  namespace: argo
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - env: dev
        project: cluster-infra
        url: https://kubernetes.default.svc
        valueFiles:
        - values-dev.yaml
  template:
    metadata:
      name: "{{ .env }}-foo"
    spec:
      project: "{{ .project }}"
      destination:
        server: "{{ .url }}"
        namespace: "{{ .env }}"
      source:
        helm:
          parameters:
          - name: image.tag
            value: 1.17.10
          releaseName: "{{ .env }}-foo"
          valueFiles:
          {{- range .valueFiles }}
          - {{ . }}
          {{- end }}
        repoURL: https://github.com/foobargem/argocd-example.git
        path: charts/foo
        targetRevision: dev-app
